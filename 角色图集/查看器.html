<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>银魂 角色图集查看器</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { --bg:#14161a; --panel:#1d2026; --line:#2c313a; --fg:#e7e9ee; --dim:#8b93a1; --acc:#ffcf5a; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; display:flex; height:100vh; }
  #side { width:230px; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; }
  #side h1 { font-size:15px; margin:0; padding:12px 14px 6px; }
  #side small { color:var(--dim); padding:0 14px 8px; display:block; }
  #q { margin:0 12px 8px; padding:6px 8px; background:var(--bg); border:1px solid var(--line); color:var(--fg); border-radius:6px; }
  #list { overflow:auto; flex:1; padding-bottom:12px; }
  .it { padding:5px 14px; cursor:pointer; display:flex; justify-content:space-between; gap:8px; }
  .it:hover { background:#262b33; } .it.on { background:#34301d; color:var(--acc); }
  .it span:last-child { color:var(--dim); font-size:12px; }
  #main { flex:1; display:flex; flex-direction:column; min-width:0; }
  #bar { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; padding:10px 14px; background:var(--panel); border-bottom:1px solid var(--line); }
  #bar label { color:var(--dim); } #bar select,#bar input[type=range] { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:4px 6px; }
  #info { padding:8px 14px; color:var(--dim); font-size:12.5px; border-bottom:1px solid var(--line); min-height:34px; }
  #stage { flex:1; overflow:auto; padding:14px; }
  #cv { background:
      conic-gradient(#3a4150 25%, #343a47 0 50%, #3a4150 0 75%, #343a47 0) 0 0/24px 24px; border:1px solid var(--line); border-radius:8px; display:block; margin:0 auto; image-rendering:pixelated; max-width:100%; }
  #grid { display:flex; flex-wrap:wrap; gap:10px; }
  .cell { background:conic-gradient(#3a4150 25%, #343a47 0 50%, #3a4150 0 75%, #343a47 0) 0 0/16px 16px; border:1px solid var(--line); border-radius:6px; padding:4px; text-align:center; }
  .cell canvas { image-rendering:pixelated; display:block; margin:0 auto; }
  .cell div { font-size:11.5px; color:#dfe3ea; margin-top:2px; } .cell div i { color:var(--dim); font-style:normal; }
  .hint { color:var(--dim); font-size:12px; padding:0 14px 10px; }
</style></head>

const $ = id => document.getElementById(id);
const imgs = {};
function getImg(c) { if (!imgs[c.id]) { const im = new Image(); im.src = c.dir + '/' + c.meta.image; imgs[c.id] = im; } return imgs[c.id]; }
let cur = null, curAnim = null, t0 = performance.now();

function buildList(filter) {
  const f = (filter || '').trim().toLowerCase();
  $('list').innerHTML = '';
  DATA.chars.filter(c => !f || c.id.toLowerCase().includes(f) || (c.meta.name || '').toLowerCase().includes(f)).forEach(c => {
    const d = document.createElement('div'); d.className = 'it' + (cur && cur.id === c.id ? ' on' : '');
    d.innerHTML = '<span>' + (c.meta.name || c.id) + '</span><span>' + c.id + '</span>';
    d.onclick = () => pick(c); $('list').appendChild(d);
  });
  $('count').textContent = DATA.chars.length + ' 个角色';
}
function pick(c) {
  cur = c; const names = Object.keys(c.meta.animations);
  $('anim').innerHTML = names.map(n => '<option>' + n + '</option>').join('');
  curAnim = names.includes('idle') ? 'idle' : names[0]; $('anim').value = curAnim;
  buildList($('q').value); updateInfo(); rebuildGrid(); t0 = performance.now();
}
function updateInfo() {
  if (!cur) return; const m = cur.meta, a = m.animations[curAnim] || {};
  $('info').textContent = (m.name || cur.id) + '（' + cur.id + '）　格子 ' + m.cell.join('×') + '　脚点 (' + m.pivot.join(', ') + ')　动作 ' + Object.keys(m.animations).length + ' 个　｜　' +
    curAnim + '：' + (a.frames || 0) + ' 帧 @' + (a.fps || 12) + 'fps　' + ({loop:'循环', oneshot:'一次性', static:'静态'}[a.kind] || '') +
    (a.seamless === 'approx' ? '（首尾近似衔接，差 ' + (a.loop_error_px ?? '?') + ' 像素）' : a.seamless === false ? '（没找到周期）' : '');
}
function frameOf(a, t) {   // t 秒 → 帧号
  const n = Math.floor(t * (a.fps || 12));
  if (a.kind === 'loop') return n % a.frames;
  if (a.kind === 'oneshot') { const total = a.frames + Math.round((a.fps || 12) * 0.6); return Math.min(n % total, a.frames - 1); }

  if (guides) {
    ctx.lineWidth = 1 / s; ctx.strokeStyle = 'rgba(255,207,90,.55)'; ctx.strokeRect(-px, -py, cw, ch);
    ctx.strokeStyle = 'rgba(255,90,90,.9)'; ctx.beginPath(); ctx.moveTo(-3, 0); ctx.lineTo(3, 0); ctx.moveTo(0, -3); ctx.lineTo(0, 3); ctx.stroke();
  }
  ctx.restore();

let gridCells = [];
function rebuildGrid() {
  const g = $('grid'); g.innerHTML = ''; gridCells = []; if (!cur) return;
  const s = 2, m = cur.meta;
  Object.entries(m.animations).forEach(([name, a]) => {
    const d = document.createElement('div'); d.className = 'cell';
    const cv = document.createElement('canvas'); cv.width = m.cell[0] * s; cv.height = m.cell[1] * s;
